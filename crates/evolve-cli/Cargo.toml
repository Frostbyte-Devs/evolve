[package]
name = "evolve-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Evolve CLI — drop-in passive evolution for AI coding assistants"

[[bin]]
name = "evolve"
path = "src/main.rs"

[dependencies]
evolve-adapters = { path = "../evolve-adapters" }
evolve-core = { path = "../evolve-core" }
evolve-dashboard = { path = "../evolve-dashboard" }
evolve-llm = { path = "../evolve-llm" }
evolve-proxy = { path = "../evolve-proxy" }
evolve-storage = { path = "../evolve-storage" }
clap.workspace = true
dirs.workspace = true
reqwest.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "signal"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
