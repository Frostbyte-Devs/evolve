[package]
name = "evolveai-ts"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "TypeScript bindings for Evolve (npm install evolveai)"

[lib]
# napi-rs CLI looks for libevolveai_ts.{so,dylib,dll} (derived from the package
# name 'evolveai-ts'), so the library name must match.
name = "evolveai_ts"
crate-type = ["cdylib"]

[dependencies]
evolve-core = { path = "../../crates/evolve-core" }
napi = { version = "2", features = ["napi9"] }
napi-derive = "2"
rand = "0.8"
rand_chacha = "0.3"

[build-dependencies]
napi-build = "2"
