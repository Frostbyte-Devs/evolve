[workspace]
resolver = "2"
members = []
exclude = []

[package]
name = "evolve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kristian Baer <kristianb43r@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/NORTHTEKDevs/evolve"
homepage = "https://github.com/NORTHTEKDevs/evolve"
description = "Evolutionary computation for LLM agents"
keywords = ["llm", "agents", "evolution", "genetic-algorithms", "ai"]
categories = ["science", "algorithms"]

[workspace.dependencies]
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
rand = "0.8"
rand_chacha = "0.3"
async-trait = "0.1"
futures = "0.3"
dashmap = "6.0"
proptest = "1.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
