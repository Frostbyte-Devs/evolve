[workspace]
resolver = "2"
members = [
    "crates/evolve-adapters",
    "crates/evolve-core",
    "crates/evolve-llm",
    "crates/evolve-mutators",
    "crates/evolve-proxy",
    "crates/evolve-storage",
]
exclude = []

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kristian Baer <kristianb43r@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/NORTHTEKDevs/evolve"
homepage = "https://github.com/NORTHTEKDevs/evolve"
description = "Evolutionary computation for LLM agents"
keywords = ["llm", "agents", "evolution", "genetic-algorithms", "ai"]
categories = ["science", "algorithms"]

[workspace.dependencies]
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
rand = "0.8"
rand_chacha = "0.3"
async-trait = "0.1"
futures = "0.3"
dashmap = "6.0"
proptest = "1.5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
tempfile = "3"
rand_distr = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
wiremock = "0.6"
regex = "1"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
